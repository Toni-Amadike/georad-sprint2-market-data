<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Land Value Intelligence · GeoRAD Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="map" aria-label="Land Value Intelligence map"></div>

    <aside class="panel" aria-label="Search and details">
      <header class="panel-header">
        <p class="brand">GeoRAD Academy</p>
        <h1>Land Value Intelligence</h1>
      </header>

      <form id="search-form" class="search" autocomplete="off">
        <input
          id="search-input"
          type="search"
          name="town"
          placeholder="Search town"
          aria-label="Search town"
        />
        <button type="submit">Go</button>
      </form>

      <p id="status" class="status" aria-live="polite"></p>

      <div class="block">
        <div class="block-head">
          <h2>Locations</h2>
          <button id="clear-selection" class="text-btn" type="button">Clear</button>
        </div>
        <ul id="town-list" class="town-list"></ul>
      </div>

      <section class="block details-block">
        <h2>Details</h2>
        <div id="details" class="details" aria-live="polite"></div>
      </section>
    </aside>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./app.js" defer></script>
  </body>
</html>
